# ========================================
# CI: Helm Chart 打包 + 发布
# ========================================
# 触发：推送 v* tag
# 产出：Chart 包发布到 GitHub Releases 或 OCI Registry
#
# 使用方式：
#   helm install pm oci://ghcr.io/<owner>/charts/project-manager --version 1.3.0

name: Release Chart

on:
  push:
    tags:
      - "v*"

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update Chart version
        working-directory: helm
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" Chart.yaml
          cat Chart.yaml

      - name: Package Chart
        run: |
          helm package helm/ --destination ./
          CHART_PKG=$(ls project-manager-*.tgz)
          echo "chart_package=$CHART_PKG" >> $GITHUB_ENV

      - name: Push to OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push ${{ env.chart_package }} oci://ghcr.io/${{ github.repository }}/charts
        continue-on-error: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.chart_package }}
        continue-on-error: true
