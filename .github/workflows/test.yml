# CI: Backend tests + Frontend build
# Triggers: push/PR to main
# Jobs: backend-test (lint + pytest) → frontend-test (tsc + eslint + build)

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # SQLite 无需外部服务，直接文件测试
      # 如需 PostgreSQL 测试，取消下方注释
      # postgres:
      #   image: postgres:16-alpine
      #   env:
      #     POSTGRES_USER: pm
      #     POSTGRES_PASSWORD: CHANGE-ME
      #     POSTGRES_DB: pm_test
      #   ports:
      #     - 5432:5432
      #   options: >-
      #     --health-cmd pg_isready
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --ignore=E501,F401,F841 --quiet
        continue-on-error: true

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-min-32-chars!!
          ADMIN_PASSWORD_HASH: $2b$12$ciTestHashPlaceholderForCIOnly000000000000000000000000
          AGENT_PASSWORDS_JSON: "{}"
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          DEBUG: "true"
        run: |
          pytest tests/ -v --tb=short -x

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npx eslint src/ --max-warnings=0 || true
        continue-on-error: true

      - name: Build
        run: npm run build
