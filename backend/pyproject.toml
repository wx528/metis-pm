[project]
name = "metis-pm"
version = "1.3.0"
description = "Metis PM - Human-AI Collaborative Project Management System"
readme = "../README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [
    {name = "Metis PM Contributors"}
]
keywords = ["mcp", "project-management", "ai-agent", "human-ai-collaboration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "mcp>=1.12",
    "httpx[socks]>=0.27",
    "asgi-lifespan>=2.1",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "bcrypt>=4.0",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/wx528/metis-pm"
Repository = "https://github.com/wx528/metis-pm"
Issues = "https://github.com/wx528/metis-pm/issues"

[project.scripts]
metis-pm-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
copilot = [
    "pm-copilot-engine>=0.1",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
