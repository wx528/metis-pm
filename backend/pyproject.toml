[project]
name = "metis-pm"
version = "0.1.0"
description = "Metis PM - Human-AI Collaborative Project Management System"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PM Team"}
]
keywords = ["mcp", "project-management", "ai-agent", "human-ai-collaboration"]

dependencies = [
    "httpx>=0.27",
    "mcp>=1.12.0",
]

[project.scripts]
metis-pm-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server"]
