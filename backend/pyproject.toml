[project]
name = "metis-pm"
version = "0.1.0"
description = "Metis PM - Human-AI Collaborative Project Management System"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    {name = "Metis PM Contributors"}
]
keywords = ["mcp", "project-management", "ai-agent", "human-ai-collaboration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "httpx>=0.27",
    "mcp>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/wx528/metis-pm"
Repository = "https://github.com/wx528/metis-pm"
Issues = "https://github.com/wx528/metis-pm/issues"

[project.scripts]
metis-pm-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
