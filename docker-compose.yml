services:
  backend:
    build: ./backend
    container_name: pm-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/project_manager.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080},http://${HOST_IP:-localhost}:${FRONTEND_PORT:-8080}}
      - DEBUG=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mcp:
    build: ./backend
    container_name: pm-mcp
    ports:
      - "${MCP_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      - PM_API_URL=http://backend:8000/api/v1
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=9000
      - MCP_HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    entrypoint: ["python", "mcp_server.py"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: "0.8.0"
    container_name: pm-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  sqlite_data:
