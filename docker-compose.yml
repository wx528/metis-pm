services:
  backend:
    build: ./backend
    container_name: pm-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/project_manager.db
      # CORS_ORIGINS 默认包含 localhost + HOST_IP（用于 Tailscale/内网访问）
      # 如需跨多设备访问，在 .env 中设置 HOST_IP=家中服务器IP 或 CORS_ORIGINS=完整列表
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080},http://${HOST_IP:-localhost}:${FRONTEND_PORT:-8080}}
      - DEBUG=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mcp:
    build: ./backend
    container_name: pm-mcp
    ports:
      - "${MCP_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      - PM_API_URL=http://backend:8000/api/v1
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=9000
      - MCP_HOST=0.0.0.0
      # 角色密码从 AGENT_PASSWORDS 统一读取，无需单独设置
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    entrypoint: ["python", "mcp_server_unified.py"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: "${APP_VERSION:-1.0.0}"
    container_name: pm-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  sqlite_data:
