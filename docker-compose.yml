services:
  backend:
    build: ./backend
    container_name: pm-backend
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: [sqlite_data:/data]
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/metis_pm.db
      - API_KEY=${API_KEY:-metis-pm-default-key-change-me}
      - SECRET_KEY=${SECRET_KEY:-not-used-in-v2}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - AGENT_PASSWORDS_JSON=${AGENT_PASSWORDS_JSON:-{}}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pm-frontend
    ports: ["${FRONTEND_PORT:-8080}:80"]
    depends_on: [backend]
    restart: unless-stopped

  agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
      args:
        ROLE_DIR: agent
    container_name: pm-agent
    ports: ["9001:9001"]
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
      - API_KEY=${API_KEY:-metis-pm-default-key-change-me}
      - PM_MODEL=${PM_MODEL:-gpt-4o}
      - PM_API_BASE_URL=${PM_API_BASE_URL}
      - PM_API_KEY=${PM_API_KEY}
      - ROLE=agent
      - MCP_PORT=9001
    depends_on: [backend]
    restart: unless-stopped

  mate:
    build:
      context: ./agents
      dockerfile: Dockerfile
      args:
        ROLE_DIR: mate
    container_name: pm-mate
    ports: ["9002:9002"]
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
      - API_KEY=${API_KEY:-metis-pm-default-key-change-me}
      - PM_MODEL=${PM_MODEL:-gpt-4o}
      - PM_API_BASE_URL=${PM_API_BASE_URL}
      - PM_API_KEY=${PM_API_KEY}
      - ROLE=mate
      - MCP_PORT=9002
    depends_on: [backend]
    restart: unless-stopped

  tester:
    build:
      context: ./agents
      dockerfile: Dockerfile
      args:
        ROLE_DIR: tester
    container_name: pm-tester
    ports: ["9003:9003"]
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
      - API_KEY=${API_KEY:-metis-pm-default-key-change-me}
      - PM_MODEL=${PM_MODEL:-gpt-4o}
      - PM_API_BASE_URL=${PM_API_BASE_URL}
      - PM_API_KEY=${PM_API_KEY}
      - ROLE=tester
      - MCP_PORT=9003
    depends_on: [backend]
    restart: unless-stopped

  registrar:
    build:
      context: ./agents
      dockerfile: Dockerfile
      args:
        ROLE_DIR: registrar
    container_name: pm-registrar
    ports: ["9004:9004"]
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
      - API_KEY=${API_KEY:-metis-pm-default-key-change-me}
      - PM_MODEL=${PM_MODEL:-gpt-4o}
      - PM_API_BASE_URL=${PM_API_BASE_URL}
      - PM_API_KEY=${PM_API_KEY}
      - ROLE=registrar
      - MCP_PORT=9004
    depends_on: [backend]
    restart: unless-stopped

volumes:
  sqlite_data:
