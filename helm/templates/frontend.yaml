{{- /*
  Frontend Deployment + Service + ConfigMap (nginx)
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "project-manager.fullname" . }}-nginx
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        client_max_body_size 10m;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /assets/ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location /api/ {
            proxy_pass http://{{ include "project-manager.fullname" . }}-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_read_timeout 86400s;
        }

        location /mcp {
            proxy_pass http://{{ include "project-manager.fullname" . }}-mcp:9000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_read_timeout 86400s;
        }

        location /metrics {
            proxy_pass http://{{ include "project-manager.fullname" . }}-backend:8000/metrics;
        }

        location /health {
            proxy_pass http://{{ include "project-manager.fullname" . }}-backend:8000/health;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-manager.fullname" . }}-frontend
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "project-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "project-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "project-manager.fullname" . }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "project-manager.fullname" . }}-frontend
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "project-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 80
