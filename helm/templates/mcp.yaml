{{- /*
  MCP Server Deployment + Service
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-manager.fullname" . }}-mcp
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "project-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "project-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.registry }}{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ include "project-manager.fullname" . }}-secret
          env:
            - name: PM_API_URL
              value: "http://{{ include "project-manager.fullname" . }}-backend:8000/api/v1"
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: MCP_PORT
              value: "9000"
            - name: MCP_HOST
              value: "0.0.0.0"
          command: ["python", "mcp_server_unified.py"]
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "project-manager.fullname" . }}-mcp
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  selector:
    {{- include "project-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  ports:
    - port: 9000
      targetPort: 9000
