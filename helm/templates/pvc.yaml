{{- /*
  PVC: SQLite 数据 + 备份（仅�?PostgreSQL 模式�?*/ -}}
{{- if not .Values.postgresql.enabled -}}
{{- if .Values.persistence.sqlite.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "metis-pm.fullname" . }}-sqlite
  labels:
    {{- include "metis-pm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.sqlite.storageClass }}
  storageClassName: {{ .Values.persistence.sqlite.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.sqlite.size }}
---
{{- end -}}
{{- if .Values.persistence.backup.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "metis-pm.fullname" . }}-backup
  labels:
    {{- include "metis-pm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.backup.storageClass }}
  storageClassName: {{ .Values.persistence.backup.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.backup.size }}
{{- end -}}
{{- end -}}
