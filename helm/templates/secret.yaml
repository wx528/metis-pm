{{- /*
  Secret: 应用配置（密码、密钥等）
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "project-manager.fullname" . }}-secret
  labels:
    {{- include "project-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secretKey | quote }}
  ADMIN_PASSWORD: {{ .Values.adminPassword | quote }}
  AGENT_PASSWORDS: {{ .Values.agentPasswords | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "project-manager.fullname" . }}-postgres/{{ .Values.postgresql.auth.database }}"
  {{- else }}
  DATABASE_URL: "sqlite+aiosqlite:////data/project_manager.db"
  {{- end }}
